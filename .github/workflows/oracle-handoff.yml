name: Manual Oracle deployment handoff

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Verify access first; import only after disabling the Actions monitor'
        type: choice
        options: [verify, import]
        default: verify

permissions:
  contents: read
  actions: read

concurrency:
  group: plush-stock-monitor
  cancel-in-progress: false

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      ORACLE_SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
      ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      ORACLE_SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
      DELIVERY_ZIP: ${{ secrets.DELIVERY_ZIP }}
      MONITOR_STATE_KEY: ${{ secrets.MONITOR_STATE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_API_KEY_SID: ${{ secrets.TWILIO_API_KEY_SID }}
      TWILIO_API_KEY_SECRET: ${{ secrets.TWILIO_API_KEY_SECRET }}
      TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
      TEXTBELT_API_KEY: ${{ secrets.TEXTBELT_API_KEY }}
      ALERT_SMS_TO: ${{ secrets.ALERT_SMS_TO }}
      SUMMARY_SMS_TO: ${{ secrets.SUMMARY_SMS_TO }}
      PHASE: ${{ inputs.phase }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Transfer over verified SSH without starting a monitor
        run: python -m app.oracle_handoff "$PHASE" --await-network
